name: Selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow
      - name: Run repository selftest
        run: python3 tools/selftest.py
      - name: Prove write-path locks
        run: python3 tools/prove_locks.py
      - name: Lock shared idea.md extractor
        run: python3 tools/idea_utils_contract.py
      - name: Lock shared phrase shortener
        run: python3 tools/phrase_utils_contract.py
      - name: Tracking integrity (stub/placeholder risk)
        run: python3 tools/tracking_integrity_check.py
      - name: Run number consistency (drift risk)
        run: python3 tools/run_number_consistency_check.py
      - name: Human guidance integrity (OAuth path consistency)
        run: python3 tools/human_guidance_integrity_check.py
