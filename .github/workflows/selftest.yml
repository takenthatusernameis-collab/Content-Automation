name: Selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow
      - name: Run repository selftest
        run: python3 tools/selftest.py
