name: YouTube production

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Perform the authenticated YouTube write (initial privacy is private)"
        required: false
        type: boolean
        default: false
      post_comment:
        description: "Post the approved first comment after upload"
        required: false
        type: boolean
        default: false

concurrency:
  group: youtube-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youtube-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PACKET: videos/002-stop-deciding-what-to-work-on-every-morning
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Fail fast if execute was requested without OAuth secrets
        if: ${{ inputs.execute == true }}
        run: python3 tools/oauth_preflight.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media inspection dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize verified Q1 media
        run: python3 tools/materialize_q1_release.py

      - name: Inspect upload gates without provider write
        if: ${{ inputs.execute != true }}
        shell: bash
        run: |
          set +e
          python3 tools/youtube_upload.py "$PACKET" --write-state
          status=$?
          set -e
          # Missing OAuth is expected in dry-run mode. Other failures remain hard failures.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Execute authenticated YouTube upload
        if: ${{ inputs.execute == true }}
        run: |
          python3 tools/youtube_upload.py "$PACKET" --execute ${{ inputs.post_comment == true && '--post-comment' || '' }}

      - name: Persist non-secret upload state
        if: ${{ inputs.execute == true }}
        shell: bash
        run: |
          set -euo pipefail
          export STATE="$PACKET/upload_state.json"
          if [ ! -f "$STATE" ]; then
            echo "No upload_state.json produced; nothing to persist."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, sys
          path = os.environ["STATE"]
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          provider_id = str(data.get("provider_video_id") or "").strip()
          if not provider_id:
              print("No provider_video_id; not committing transient failure state.")
              sys.exit(0)
          print(f"Persisting redacted upload state for provider video {provider_id}.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          git diff --cached --quiet && {
            echo "Upload state unchanged; nothing to commit."
            exit 0
          }
          git commit -m "Persist YouTube upload state"
          git push origin HEAD:main

      - name: Summarize runtime boundary
        if: ${{ always() }}
        run: |
          echo "Q1 production workflow completed."
          echo "Initial YouTube privacy is private in tools/youtube_upload.py."
          echo "OAuth secrets are read only from GitHub Actions secrets."
          echo "Verified release media is materialized with checksum guards."
