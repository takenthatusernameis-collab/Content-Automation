name: YouTube production

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Perform the authenticated YouTube write (initial privacy is private)"
        required: false
        type: boolean
        default: false
      post_comment:
        description: "Extra request only. An approved first comment already posts on execute. Leave false unless forcing that request."
        required: false
        type: boolean
        default: false
      skip_comment:
        description: "Opt out of posting the approved first comment on this execute. Wins over post_comment."
        required: false
        type: boolean
        default: false
      collect_feedback:
        description: "Read-only Analytics and comment fetch after a provider video id exists. Does not upload."
        required: false
        type: boolean
        default: false
      packet:
        description: "Packet folder under videos/. Default is the live Q1 packet. A different folder is not materialized from the Q1 releases."
        required: false
        type: string
        default: videos/002-stop-deciding-what-to-work-on-every-morning

concurrency:
  group: youtube-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youtube-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PACKET: ${{ inputs.packet }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          # Full history so a rejected provider-state push can rebase without
          # a mid-job unshallow. A depth-1 checkout has no merge base. Do not
          # restore the default shallow checkout. Do not force-push.
          fetch-depth: 0

      - name: Print stall flags
        run: python3 tools/stall_watch.py
        # Existing printer. Non-zero is not expected. Do not fail the job on a flag.
        # Does not add a scanner and does not poll secrets.

      - name: Fail fast if an authenticated step was requested without OAuth secrets
        if: ${{ inputs.execute == true || inputs.collect_feedback == true }}
        run: python3 tools/oauth_preflight.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media inspection dependency
        if: ${{ inputs.collect_feedback != true || inputs.execute == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Refuse a packet path outside videos/
        run: python3 tools/packet_path.py

      - name: Materialize verified Q1 media
        if: ${{ (inputs.collect_feedback != true || inputs.execute == true) && inputs.packet == 'videos/002-stop-deciding-what-to-work-on-every-morning' }}
        run: python3 tools/materialize_q1_release.py

      - name: Inspect upload gates without provider write
        if: ${{ inputs.execute != true && inputs.collect_feedback != true }}
        shell: bash
        run: |
          set +e
          python3 tools/youtube_upload.py "$PACKET" --write-state
          status=$?
          set -e
          # Missing OAuth is expected in dry-run mode. Other failures remain hard failures.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Execute authenticated YouTube upload
        if: ${{ inputs.execute == true }}
        run: |
          python3 tools/youtube_upload.py "$PACKET" --execute ${{ inputs.post_comment == true && '--post-comment' || '' }} ${{ inputs.skip_comment == true && '--skip-comment' || '' }}
          # An approved first comment posts on this execute. post_comment=true is only an extra request.
          # skip_comment=true passes --skip-comment and wins over post_comment. Data API insert does not pin.

      - name: Print Studio pin handoff
        if: ${{ always() && inputs.execute == true }}
        shell: bash
        run: |
          # Data API insert is not a pin. Print the Studio URL when a video id exists.
          # Missing state is not a failure and must not start another videos.insert.
          if [ -f "$PACKET/upload_state.json" ]; then
            # --write stores studio_pin.md only when a provider video id exists.
            # A missing id does not invent a URL file. pinned stays false.
            python3 tools/studio_handoff.py "$PACKET" --write
          else
            echo "STUDIO_PIN"
            echo "status: no_upload_state"
            echo "pinned: false"
          fi


      - name: Plan playlist membership
        if: ${{ always() && inputs.execute == true }}
        shell: bash
        run: |
          # not_set does not invent a playlist id and does not fail the upload.
          # A missing video id does not start videos.insert.
          # A failed playlistItems.insert exits 2 and does not start videos.insert.
          if [ -f "$PACKET/upload_state.json" ]; then
            python3 tools/playlist_membership.py "$PACKET" --execute --write
          else
            echo "PLAYLIST_MEMBERSHIP"
            echo "status: no_upload_state"
            echo "membership: not_added"
          fi

      - name: Persist non-secret upload state
        if: ${{ always() && inputs.execute == true }}
        shell: bash
        run: |
          set -euo pipefail
          export STATE="$PACKET/upload_state.json"
          if [ ! -f "$STATE" ]; then
            echo "No upload_state.json produced; nothing to persist."
            exit 0
          fi
          set +e
          decision=$(python3 tools/persist_provider_state.py classify-upload "$STATE")
          status=$?
          set -e
          echo "$decision"
          if [ "$status" -eq 2 ]; then
            echo "Transient upload failure; not committing."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          # Persist the Studio URL with the video id. Skip when no id was written.
          if [ -f "$PACKET/studio_pin.md" ]; then
            git add "$PACKET/studio_pin.md"
          fi
          if [ -f "$PACKET/playlist_plan.md" ]; then
            git add "$PACKET/playlist_plan.md"
          fi
          git diff --cached --quiet && {
            echo "Upload state unchanged; nothing to commit."
            exit 0
          }
          git commit -m "Persist YouTube upload state"
          # A rejected push must not drop the video id. Retry after fetch. Never force-push.
          python3 - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, "tools")
          from persist_provider_state import push_with_retry

          def run(cmd):
              proc = subprocess.run(cmd, capture_output=True, text=True)
              return proc.returncode, proc.stdout, proc.stderr

          print(push_with_retry(run))
          PY

      - name: Collect read-only YouTube feedback
        if: ${{ inputs.collect_feedback == true && inputs.execute != true }}
        run: |
          python3 tools/youtube_feedback.py "$PACKET" --execute
          python3 tools/experiment_loop.py "$PACKET" --write-state

      - name: Persist collected feedback state
        if: ${{ always() && inputs.collect_feedback == true && inputs.execute != true }}
        shell: bash
        run: |
          set -euo pipefail
          export STATE="$PACKET/feedback_state.json"
          export EXP="$PACKET/experiment_state.json"
          if [ ! -f "$STATE" ]; then
            echo "No feedback_state.json produced; nothing to persist."
            exit 0
          fi
          set +e
          decision=$(python3 tools/persist_provider_state.py classify-feedback "$STATE")
          status=$?
          set -e
          echo "$decision"
          if [ "$status" -eq 2 ]; then
            echo "Feedback is not a collected fetch; not committing."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          if [ -f "$EXP" ]; then
            git add "$EXP"
          fi
          git diff --cached --quiet && {
            echo "Feedback state unchanged; nothing to commit."
            exit 0
          }
          git commit -m "Persist collected YouTube feedback state"
          # A rejected push must not drop collected metrics. Retry after fetch. Never force-push.
          python3 - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, "tools")
          from persist_provider_state import push_with_retry

          def run(cmd):
              proc = subprocess.run(cmd, capture_output=True, text=True)
              return proc.returncode, proc.stdout, proc.stderr

          print(push_with_retry(run))
          PY

      - name: Summarize runtime boundary
        if: ${{ always() }}
        run: |
          echo "Q1 production workflow completed."
          echo "Initial YouTube privacy is private in tools/youtube_upload.py."
          echo "Job timeout is 60 minutes so a slow chunk PUT can finish and persist before the runner is killed."
          echo "A generated vo_origin sets status.containsSyntheticMedia. An unknown kind fails before the token refresh."
          echo "OAuth secrets are read only from GitHub Actions secrets."
          echo "Verified release media is materialized with checksum guards."
          echo "collect_feedback is read-only and defaults off. It does not upload or invent metrics."
          echo "collect_feedback refuses a missing or early uploaded_at and does not write COLLECTED."
          echo "collect_feedback does not commit a COLLECTED file unless window.kind is first_calendar_days."
          echo "The observation is due at upload plus 7 days plus 3 days of Analytics lag. The query is the first 7 calendar days of that video, not a sliding now window."
          echo "A resumed upload keeps the existing uploaded_at. It does not invent one."
          echo "A caption or thumbnail failure exits non-zero after the video id is written."
          echo "A 200/201 whose session then returns 404 or 410 is RESUMABLE_COMPLETED_SESSION_GONE. That state is committed and the next execute must not insert again."
          echo "A session POST that returns 503 without Location is retried. A 503 that returns Location is that session, not a second videos.insert."
          echo "Chunk 408 and 429 resume the existing session. They do not start another videos.insert."
          echo "A later execute resumes that video id when the export hash matches. It does not upload a second copy."
          echo "Captions wait up to about 10 minutes for processingDetails succeeded or terminated. A not-ready poll is VIDEO_PROCESSING_NOT_READY and must not insert again."
          echo "Export identity is the file hash, not mtime, so rematerialize does not look like a new master."
          echo "Snippet fields over the provider limit fail before the token refresh. Tags are not sliced."
          echo "A token missing caption scope fails before videos.insert. It does not create an uncaptioned video."
          echo "Upload state is persisted even when that post-upload step fails."
          echo "collect_feedback is skipped when execute is also true; the observation window cannot be due in that dispatch."
